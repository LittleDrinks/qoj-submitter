[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qoj-submitter-direct"
version = "0.1.0"
description = "A direct command-line submitter for QOJ contests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "beautifulsoup4>=4.12,<5", "pycurl>=7.45,<8"]

[project.urls]
Repository = "https://github.com/LittleDrinks/qoj-submitter"

[project.scripts]
qoj = "qoj_submitter.cli:main"
qoj-submit = "qoj_submitter.cli:submit_main"

[tool.setuptools.packages.find]
include = ["qoj_submitter*"]
