name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Browser recovery with Chrome
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QOJ_BROWSER_TEST_EXECUTABLE = "$env:ProgramFiles/Google/Chrome/Application/chrome.exe"
          python -m unittest discover -s tests -p test_browser_cli.py -v
      - run: qoj --help
      - run: qoj-submit --help
      - run: submit --help
